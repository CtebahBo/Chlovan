<style>

.weekbar{display:flex;gap:8px;overflow:auto;padding:12px 18px 8px}.weekbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap}.weekbtn.active{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:8px 14px}.screen{display:none}.screen.active{display:block}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;box-shadow:var(--shadow);overflow:hidden}.dayhead{padding:13px 15px 7px;font-weight:800;font-size:14px}.slot{border-top:1px solid var(--line);padding:12px 15px;display:flex;align-items:center;gap:12px}.slotlabel{width:50px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.meal{flex:1;min-width:0}.meal-lines{display:flex;flex-direction:column;gap:8px}.meal-line{display:flex;align-items:center;gap:8px}.meal-line .mealname{flex:1;min-width:0}.meal-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.add-meal{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--accent);padding:0}.meal-line .edit{padding:8px 10px}.mealname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meal-link{border:0;background:transparent;padding:0;text-align:left;width:100%;cursor:pointer;color:inherit}.meal-link:hover{text-decoration:underline}.empty{color:#aaa;font-weight:500}.edit{border:0;background:var(--accent2);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;padding:15px;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 12px}
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:20px 3px 8px}
.course-cat{margin:12px 0}.course-cat h3{font-size:15px;margin:0 0 7px}.course-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.course-row input{width:19px;height:19px;margin-top:1px}.course-main{flex:1}.qty{font-weight:800}.source{font-size:11px;color:var(--muted);margin-top:2px}.checked{text-decoration:line-through;opacity:.45}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}.meal-list{display:grid;gap:8px;margin-top:10px}.meal-option{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.meal-option:hover{border-color:var(--accent)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav{width:min(760px,100%);display:flex}.nav button{flex:1;border:0;background:transparent;padding:12px 5px 10px;color:var(--muted);font-size:11px;font-weight:700}.nav button.active{color:var(--accent)}.icon{display:flex;width:34px;height:30px;align-items:center;justify-content:center;margin:0 auto 3px;border-radius:9px;font-size:20px}.nav button.active .icon{background:var(--accent);color:#fff}.recipe-add{display:flex;justify-content:space-between;align-items:center}.recipe-add button{font-size:22px;width:40px;height:40px;border-radius:12px}.ingredient-edit{display:grid;grid-template-columns:1.6fr .7fr .7fr 1fr auto;gap:7px;align-items:center;margin-bottom:8px}.ingredient-edit input,.ingredient-edit select{min-width:0;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}.ingredient-edit button{border:0;background:#f2f2f2;border-radius:9px;width:34px;height:34px}.recipe-list-note{margin-bottom:10px}

.actions{display:flex;gap:8px}.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.primary{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700}

.empty-state{text-align:center;padding:30px 15px;color:var(--muted)}.archive-item{display:flex;justify-content:space-between;align-items:center;gap:10px}.archive-item b{font-size:14px}.archive-item button{flex-shrink:0}

  .bottom{padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97)}

  .icon{width:38px;height:32px;font-size:19px;margin-bottom:2px}

@media (max-width:380px){
  .slotlabel{width:44px}

  .ingredient-edit .ing-qty{grid-column:1}
  .ingredient-edit .ing-unit{grid-column:2}
  .ingredient-edit .ing-cat{grid-column:1 / 3}

}

/* CHLOVAN TO-DO — shared visual language */
.todo-wrap{padding-bottom:4px}.todo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.todo-stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow)}.todo-stat b{display:block;font-size:22px}.todo-stat span{font-size:11px;color:var(--muted)}
.todo-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:10px}.todo-card.late{border-left:5px solid var(--danger)}.todo-card.running{border-left:5px solid #d9a72c}.todo-card h3{margin:0 0 7px;font-size:16px}.todo-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px}.todo-pill{padding:4px 8px;border-radius:999px;background:var(--accent2)}.todo-late{color:var(--danger);font-weight:800}.todo-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}.todo-actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.todo-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}.todo-actions .danger{color:var(--danger)}.todo-composer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}.todo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.todo-field label{display:block;font-size:10px;color:var(--muted);margin:0 0 4px}.todo-field input,.todo-field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px}.todo-full{grid-column:1/-1}.todo-filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.todo-banner{background:#fff7d6;border:1px solid #ecd98a;border-radius:15px;padding:13px;margin-bottom:12px}.todo-empty{text-align:center;padding:28px 12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:15px}.todo-modal .sheet{max-height:92vh}.todo-busy{opacity:.65;pointer-events:none}.todo-refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;color:var(--muted)}
.course-sticky-head{position:sticky;top:68px;z-index:4;display:flex;align-items:center;gap:9px;background:rgba(247,244,238,.97);backdrop-filter:blur(10px);padding:8px 2px 9px;border-bottom:1px solid var(--line);margin:0 0 8px}.course-sticky-title{font-size:13px;font-weight:850;color:var(--tab-dark);white-space:nowrap}.course-sticky-count{flex:1;min-width:0;background:var(--tab-soft);color:var(--tab-dark);border:1px solid color-mix(in srgb,var(--tab) 38%,#e7e1d8);border-radius:999px;padding:8px 11px;text-align:center;font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.course-add-button{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:11px;background:var(--tab);color:var(--tab-text);font-size:25px;line-height:1}.extra-course-grid{display:grid;grid-template-columns:1fr 120px;gap:10px}.course-buy{font-size:11px}
@media(max-width:600px){.todo-stats{grid-template-columns:repeat(3,1fr)}.todo-card{grid-template-columns:1fr}.todo-actions{justify-content:flex-start}.todo-grid,.todo-filters{grid-template-columns:1fr}.todo-full{grid-column:auto}.todo-actions button{min-height:40px}.todo-card h3{font-size:15px}}

.todo-running-banner{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 12px;box-shadow:var(--shadow)}.todo-running-summary{display:flex;align-items:center;gap:9px}.todo-running-summary b{display:block;font-size:13px}.todo-running-summary span:not(.todo-running-dot){display:block;font-size:11px;color:var(--muted);margin-top:2px}.todo-running-dot{width:9px;height:9px;border-radius:50%;background:#d9a72c;box-shadow:0 0 0 4px #fff4cc;flex:0 0 auto}.todo-running-list{display:grid;gap:6px;margin-top:8px}.todo-running-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:7px;border-top:1px solid var(--line);font-size:12px}.todo-running-item>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.todo-running-item>div{display:flex;gap:5px;flex-shrink:0}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:700}.mini.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.todo-running-label{color:#9a7410;font-weight:800}.todo-section-head{display:flex;align-items:center;justify-content:space-between}.todo-section-head>div{display:flex;gap:5px}.todo-section-head .todo-refresh{font-size:10px;padding:6px 8px}
@media(max-width:600px){.todo-running-banner{padding:10px;margin-bottom:10px}.todo-running-item{align-items:flex-start}.todo-running-item>div{gap:4px}.mini{min-height:34px;padding:5px 7px}.todo-card{padding:12px;margin:8px 0}.todo-actions{gap:5px}.todo-actions button{min-height:38px;padding:7px 9px}.todo-section-head{align-items:flex-start;gap:8px}.todo-section-head>div{flex-shrink:0}}

/* V8 refinements — pop 70 doux + ergonomie */
:root{
  --pop-orange:#e59a58;
  --pop-pink:#d98aa2;
  --pop-red:#c96d68;
  --pop-yellow:#e5c56a;
  --pop-blue:#76a9c6;
  --pop-green:#78a58b;
}
.course-stock-input{
  width:112px;
  min-height:42px;
  font-size:16px;
  text-align:center;
  border-radius:10px;
  padding:7px 10px;
}
.course-stock-line{font-size:12px}
.course-buy{color:#5f8f75}
.course-buy.enough{color:#5f8f75}
.nav button:nth-child(1).active .icon{background:var(--pop-orange)}
.nav button:nth-child(2).active .icon{background:var(--pop-pink)}
.nav button:nth-child(3).active .icon{background:var(--pop-blue)}
.nav button:nth-child(4).active .icon{background:var(--pop-yellow);color:#5c5030}
.nav button:nth-child(5).active .icon{background:var(--pop-green)}
.nav button:nth-child(1).active{color:#b76f32}
.nav button:nth-child(2).active{color:#b56b83}
.nav button:nth-child(3).active{color:#5d8ba8}
.nav button:nth-child(4).active{color:#a58a35}
.nav button:nth-child(5).active{color:#5f876f}
.todo-stat:nth-child(1){border-top:4px solid var(--pop-orange)}
.todo-stat:nth-child(2){border-top:4px solid var(--pop-green)}
.todo-stat:nth-child(3){border-top:4px solid var(--pop-red)}
.todo-running-dot{background:var(--pop-yellow);box-shadow:0 0 0 4px #fff7dc}
.todo-card.running{border-left-color:var(--pop-green)}
.todo-card.late{border-left-color:var(--pop-red)}
.todo-late{color:var(--pop-red)}
.todo-actions .primary{background:var(--pop-green);border-color:var(--pop-green)}
.todo-running-label{color:#668a73}
.todo-filter-chip:nth-child(1){border-color:#e8c9ab}
.todo-filter-chip:nth-child(2){border-color:#e6c3cd}
.todo-filter-chip:nth-child(3){border-color:#bdd3df}
.todo-filter-chip:nth-child(4){border-color:#e9dca9}
@media(max-width:600px){
  .course-stock-input{width:112px;min-height:44px;font-size:16px}
}

.todo-card{cursor:pointer;grid-template-columns:1fr auto;align-items:center}.todo-card:active{transform:scale(.995)}.todo-chevron{font-size:28px;color:#b2aea6;padding-left:4px}.todo-pill{background:#f0efec;color:#66635d}.todo-running-label{color:inherit}.todo-running-banner .todo-running-item>div{display:flex}.todo-filter-chip{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 7px;min-width:150px;flex:0 0 auto}.todo-filter-chip span{font-size:10px;color:var(--muted);font-weight:700}.todo-filter-chip select{border:0;background:transparent;min-width:0;font-size:12px;padding:3px;outline:none}.course-stock-help{margin-bottom:10px}.course-stock-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}.course-stock-line label{display:flex;align-items:center;gap:5px}.course-stock-input{width:150px;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:17px}.course-buy{color:var(--accent);font-weight:800}.course-buy.enough{color:#6f7a72}.meal-library-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.meal-library-name{border:0;background:transparent;text-align:left;padding:0;flex:1;min-width:0;color:inherit}.meal-library-row .edit{flex-shrink:0}.todo-action-modal-buttons button{min-height:42px}
.todo-new-head{display:flex;align-items:center;justify-content:space-between;margin:10px 3px 8px}
.todo-new-button{width:42px;height:42px;border:0;border-radius:12px;background:var(--pop-orange);color:#fff;font-size:26px;line-height:1;font-weight:500;box-shadow:var(--shadow)}
.todo-composer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.todo-composer-head .close{min-width:40px;min-height:40px}

<body>
<div class="app">
<header><div class="brand">CHLOVAN</div><h1 id="title">Mon menu</h1><div id="archiveShortcut" style="margin-top:8px"><button class="secondary" onclick="setScreen('archives')">🗂️ Archives</button></div></header>
<div class="weekbar" id="weekbar"></div>
<main>
<section id="planning" class="screen active"></section>
<section id="courses" class="screen"></section>
<section id="meals" class="screen"></section>
<section id="archives" class="screen"></section>
<section id="do" class="screen"></section>
<section id="todo" class="screen"></section>
</main>
</div>

<div id="todoEditModal" class="modal todo-modal"><div class="sheet">
<div class="sheettop"><div><div class="brand">TO DO</div><h2 id="todoModalTitle" style="margin:4px 0 0">Modifier la tâche</h2></div><button class="close" onclick="todoCloseEdit()">✕</button></div>
<div id="todoEditForm" style="margin-top:10px"></div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="secondary" onclick="todoCloseEdit()">Annuler</button><button class="primary" onclick="todoSaveEdit()">Enregistrer</button></div>
</div></div>
<div id="todoActionModal" class="modal todo-modal"><div class="sheet">
<div class="sheettop"><div><div class="brand">TO DO</div><h2 id="todoActionTitle" style="margin:4px 0 0">Tâche</h2></div><button class="close" onclick="todoCloseActions()">✕</button></div>
<div id="todoActionMeta" style="margin-top:10px"></div>
<div id="todoActionButtons" class="todo-action-modal-buttons" style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px"></div>
</div></div>
<div class="bottom"><div class="nav">
<button data-screen="planning" class="active"><span class="icon">📅</span>MENU</button>
<button data-screen="meals"><span class="icon">🍽️</span>REPAS</button>

const STORAGE_MENU="chlovan-menu-v1";
const STORAGE_CHECKED="chlovan-checked-v1";
const STORAGE_STOCK="chlovan-stock-v1";
const STORAGE_RECIPE_OVERRIDES="chlovan-recipe-overrides-v1";
const STORAGE_WEEKS="chlovan-weeks-v1";
const STORAGE_ARCHIVE="chlovan-archives-v1";
const STORAGE_EXTRA_COURSE="chlovan-extra-course-v1";

function isoDate(d){return d.toISOString().slice(0,10)}
function mondayOf(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const day=x.getDay();
  x.setDate(x.getDate() + (day===0 ? -6 : 1-day));
  return x;
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekLabel(monday){
  const sunday=addDays(monday,6);
  const f=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  return `du ${f(monday)} au ${f(sunday)}`;
}
function emptyWeekMenu(){
  const m={};
  for(let i=0;i<7;i++){m[`${i}-midi`]='';m[`${i}-soir`]='';m[`${i}-midi-2`]='';m[`${i}-soir-2`]='';}
  return m;
}
function getStoredWeeks(){
  try{return JSON.parse(localStorage.getItem(STORAGE_WEEKS)||"{}")||{}}catch(e){return {}}
}
function setStoredWeeks(v){localStorage.setItem(STORAGE_WEEKS,JSON.stringify(v))}
function getArchives(){
  try{return JSON.parse(localStorage.getItem(STORAGE_ARCHIVE)||"[]")||[]}catch(e){return []}
}
function setArchives(v){localStorage.setItem(STORAGE_ARCHIVE,JSON.stringify(v))}

function archiveWeek(key,label,menu){
  if(!menu || Object.values(menu).every(v=>!v)) return;
  const archives=getArchives();
  if(archives.some(a=>a.key===key)) return;
  archives.unshift({key,label,menu:{...menu},archivedAt:new Date().toISOString()});
  setArchives(archives);
}

function ensureCurrentWeeks(){
  let weeks=getStoredWeeks();
  const now=new Date();
  const current=mondayOf(now);
  const next=addDays(current,7);
  const keys=[isoDate(current),isoDate(next)];

  // Migration of the previous V1 data: keep it safely in the archive rather than losing it.
  if(!localStorage.getItem(STORAGE_WEEKS)){
    const oldMenu=JSON.parse(localStorage.getItem(STORAGE_MENU)||"null");
    if(oldMenu){
      archiveWeek('legacy-'+Date.now(),'Ancien menu V1',{
        ...Object.fromEntries(Object.entries(oldMenu).map(([k,v])=>[k.replace(/^0-/,'0-'),v]))
      });
    }
    weeks={};
  }

  // Every time the calendar moves forward, the old current week is retained as an archive.
  const previousKeys=Object.keys(weeks).sort();
  for(const key of previousKeys){
    if(!keys.includes(key)){
      archiveWeek(key,weekLabel(new Date(key+'T00:00:00')),weeks[key]);
      delete weeks[key];
    }
  }
  for(const key of keys){if(!weeks[key]) weeks[key]=emptyWeekMenu();}
  setStoredWeeks(weeks);
  localStorage.setItem(STORAGE_MENU,JSON.stringify(weeks[keys[0]]));
  return {currentKey:keys[0],nextKey:keys[1],weeks};
}

const calendar=ensureCurrentWeeks();
const state = {
  week: 0,
  screen: "planning",
  menu: calendar.weeks[calendar.currentKey],
  checked: JSON.parse(localStorage.getItem(STORAGE_CHECKED) || "{}"),
  stock: JSON.parse(localStorage.getItem(STORAGE_STOCK) || "{}"),
  editingKey: null,
  weekKeys: [calendar.currentKey,calendar.nextKey]
};
function save(){
  const weeks=getStoredWeeks();
  weeks[state.weekKeys[state.week]]=state.menu;
  setStoredWeeks(weeks);
  localStorage.setItem(STORAGE_MENU,JSON.stringify(state.menu));
  localStorage.setItem(STORAGE_CHECKED,JSON.stringify(state.checked));
  localStorage.setItem(STORAGE_STOCK,JSON.stringify(state.stock));
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function jsAttr(s){return JSON.stringify(String(s)).replace(/"/g,"&quot;");}
function showToast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
function loadCustomRecipes(){
  try{
    const custom=JSON.parse(localStorage.getItem("chlovan-custom-recipes")||"[]")||[];
    for(const r of custom){
      if(!DB.meals.some(m=>norm(m)===norm(r.name))) DB.meals.push(r.name);
      DB.ingredients=DB.ingredients.filter(x=>norm(x.plat)!==norm(r.name));
      for(const ing of (r.ingredients||[])) DB.ingredients.push({...ing,plat:r.name});
    }
    const overrides=JSON.parse(localStorage.getItem(STORAGE_RECIPE_OVERRIDES)||"[]")||[];
    for(const r of overrides){
      if(!DB.meals.some(m=>norm(m)===norm(r.name))) DB.meals.push(r.name);
      DB.ingredients=DB.ingredients.filter(x=>norm(x.plat)!==norm(r.name));
      for(const ing of (r.ingredients||[])) DB.ingredients.push({...ing,plat:r.name});
    }
  }catch(e){}
}
function saveRecipeOverride(name,ingredients){
  const list=(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_RECIPE_OVERRIDES)||"[]")||[]}catch(e){return []}})();
  const i=list.findIndex(x=>norm(x.name)===norm(name));
  const item={name,ingredients};
  if(i>=0)list[i]=item;else list.push(item);
  localStorage.setItem(STORAGE_RECIPE_OVERRIDES,JSON.stringify(list));
}
function saveCustomRecipes(list){localStorage.setItem("chlovan-custom-recipes",JSON.stringify(list))}
function getCustomRecipes(){try{return JSON.parse(localStorage.getItem("chlovan-custom-recipes")||"[]")||[]}catch(e){return []}}
function init(){
  loadCustomRecipes();
  renderWeekBar();
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setScreen(b.dataset.screen));
  updateWeekbarVisibility();
  render();
}
function updateWeekbarVisibility(){document.getElementById("weekbar").style.display=(state.screen==="planning"||state.screen==="courses")?"flex":"none";document.getElementById("archiveShortcut").style.display=state.screen==="planning"?"block":"none";}
function renderWeekBar(){
  const wb=document.getElementById("weekbar");
  wb.innerHTML=state.weekKeys.map((key,i)=>{
    const label=i===0?'Semaine en cours':'Semaine prochaine';
    const dates=weekLabel(new Date(key+'T00:00:00')).replace("du ","");
    return `<button class="weekbtn ${i===state.week?'active':''}" onclick="setWeek(${i})">${label}<br><span style="font-size:11px;opacity:.75">${esc(dates)}</span></button>`;
  }).join("");
}
function setWeek(i){
  state.week=i;
  const weeks=getStoredWeeks();
  state.menu=weeks[state.weekKeys[i]] || emptyWeekMenu();
  localStorage.setItem(STORAGE_MENU,JSON.stringify(state.menu));
  document.querySelectorAll(".weekbtn").forEach((b,j)=>b.classList.toggle("active",j===i));

function norm(x){return String(x||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function isExcluded(m){return !m || ["reste","repas extérieur","repas exterieur"].includes(norm(m));}

function calcCourses(){
  const map=new Map();
  const addItem=(category,ingredient,unit,quantity,meals)=>{
    const id=norm(category)+"|"+norm(ingredient)+"|"+norm(unit);
    if(!map.has(id)) map.set(id,{category,ingredient,unit,quantity:0,meals:new Set()});
    const x=map.get(id);
    x.quantity += Number(quantity)||0;
    (meals||[]).forEach(m=>x.meals.add(m));
  };
  for(const key of Object.keys(state.menu)){
    const meal=state.menu[key];
    if(isExcluded(meal)) continue;
    for(const ing of DB.ingredients){
      if(norm(ing.plat)!==norm(meal)) continue;
      addItem(ing.category,ing.ingredient,ing.unit,ing.quantity,[meal]);
    }
  }
  for(const x of getExtraCourseItems()){
    if(!x || !x.ingredient || !(Number(x.quantity)>0)) continue;
    addItem(x.category||"Hors menu",x.ingredient,x.unit||"unité",x.quantity,["Hors menu"]);
  }
  return [...map.values()].sort((a,b)=>{
    const order=[...DB.categoryOrder,"Hors menu"];
    const ca=order.indexOf(a.category), cb=order.indexOf(b.category);
    return (ca<0?999:ca)-(cb<0?999:cb) || a.ingredient.localeCompare(b.ingredient,'fr');
  });
}

function todoIsLate(t){if(t.status==='Terminé'||t.archived)return false;const k=t.due||t.date;if(!k)return false;return todoParseDate(k)<todoToday()}
function todoSort(a,b){const la=todoIsLate(a),lb=todoIsLate(b);if(la!==lb)return la?-1:1;const ad=a.date||'9999-12-31',bd=b.date||'9999-12-31';if(ad!==bd)return ad.localeCompare(bd);const ah=a.hour||'99:99',bh=b.hour||'99:99';if(ah!==bh)return ah.localeCompare(bh);const pr={Haute:1,Normale:2,Basse:3};return (pr[a.prio]||9)-(pr[b.prio]||9)}
function todoIsPeople(t,f){if(f==='Peu importe')return true;if(f==='Stévan')return t==='Stévan'||t==='Nous';if(f==='Chloé')return t==='Chloé'||t==='Nous';return t===f}
function todoRecalc(){TODO_DATA.tasks.forEach(t=>t.late=todoIsLate(t));TODO_DATA.tasks.sort(todoSort);todoSave()}
function todoSave(){localStorage.setItem(TODO_KEY,JSON.stringify(TODO_DATA))}
function todoNextId(){let max=0;TODO_DATA.tasks.forEach(t=>{const m=String(t.id||'').match(/^TD-(\d+)$/);if(m)max=Math.max(max,+m[1])});return 'TD-'+String(max+1).padStart(4,'0')}
function todoNewSeriesId(){return 'SER-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function todoNormalizeTask(t){return {...t,late:todoIsLate(t),archived:!!t.archived,status:t.status||'À faire',rec:t.rec||'Aucune'} }
function todoLoad(){
  let raw=localStorage.getItem(TODO_KEY);
  if(!raw){
    const old=localStorage.getItem(TODO_OLD_KEY);
    if(old){try{const d=JSON.parse(old);TODO_DATA={tasks:(d.tasks||[]).map(todoNormalizeTask),lists:TODO_LISTS};todoSave();}catch(e){TODO_DATA={tasks:[],lists:TODO_LISTS}}}
    else TODO_DATA={tasks:[],lists:TODO_LISTS};
  }else{try{const d=JSON.parse(raw);TODO_DATA={tasks:(d.tasks||[]).map(todoNormalizeTask),lists:TODO_LISTS}}catch(e){TODO_DATA={tasks:[],lists:TODO_LISTS}}
  }
  todoRecalc();
}
function todoLocalFilter(filters){
  const now=todoToday(),tomorrow=new Date(now);tomorrow.setDate(tomorrow.getDate()+1);const day=now.getDay()||7;const mon=new Date(now);mon.setDate(now.getDate()-day+1);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const nextMon=new Date(sun);nextMon.setDate(sun.getDate()+1);const nextSun=new Date(nextMon);nextSun.setDate(nextMon.getDate()+6);const key=d=>d?todoParseDate(d).getTime():null;
  return TODO_DATA.tasks.filter(t=>!t.archived&&t.status!=='Terminé').filter(t=>{if(filters.time!=='Peu importe'&&t.time!==filters.time)return false;if(!todoIsPeople(t.person,filters.person))return false;if(filters.cat!=='Peu importe'&&t.cat!==filters.cat)return false;if(filters.when==='Sans date')return !t.date&&!t.due;if(filters.when==='Aujourd’hui')return (t.date&&key(t.date)===now.getTime())||todoIsLate(t);if(filters.when==='Demain')return t.date&&key(t.date)===tomorrow.getTime();if(filters.when==='Cette semaine')return (t.date&&key(t.date)>=mon.getTime()&&key(t.date)<=sun.getTime())||todoIsLate(t);if(filters.when==='Semaine prochaine')return t.date&&key(t.date)>=nextMon.getTime()&&key(t.date)<=nextSun.getTime();if(filters.when==='En retard')return todoIsLate(t);return true}).sort(todoSort)
}
function todoTaskCard(t){
  const late=todoIsLate(t), running=t.status==='En cours'; let meta=[];
  if(t.cat)meta.push(`<span class="todo-pill">${todoEsc(t.cat)}</span>`);
  if(t.person)meta.push(`<span class="todo-pill">${todoEsc(t.person)}</span>`);
  if(t.prio)meta.push(`<span class="todo-pill">${todoEsc(t.prio)}</span>`);
  if(t.time)meta.push(`<span class="todo-pill">${todoEsc(t.time)}</span>`);
  if(t.date)meta.push(`<span class="todo-pill">${todoFmt(t.date)}${t.hour?' à '+todoEsc(t.hour):''}</span>`);
  if(t.due)meta.push(`<span class="todo-pill">Échéance ${todoFmt(t.due)}</span>`);
  if(late)meta.push(`<span class="todo-late">EN RETARD</span>`);
  if(running)meta.push(`<span class="todo-running-label">EN COURS</span>`);
  return `<article class="todo-card ${late?'late':''} ${running?'running':''}" onclick="todoOpenActions('${t.id}')"><div><h3>${todoEsc(t.task)}</h3><div class="todo-meta">${meta.join('')}</div></div><div class="todo-chevron">›</div></article>`;
}
function todoOpenActions(id){
 const t=TODO_DATA.tasks.find(x=>x.id===id);if(!t)return;
 const late=todoIsLate(t),running=t.status==='En cours';
 document.getElementById('todoActionTitle').textContent=t.task;
 document.getElementById('todoActionMeta').innerHTML=`<div class="todo-meta">${t.cat?`<span class="todo-pill">${todoEsc(t.cat)}</span>`:''}${t.person?`<span class="todo-pill">${todoEsc(t.person)}</span>`:''}${t.prio?`<span class="todo-pill">${todoEsc(t.prio)}</span>`:''}${t.time?`<span class="todo-pill">${todoEsc(t.time)}</span>`:''}${t.date?`<span class="todo-pill">${todoFmt(t.date)}${t.hour?' à '+todoEsc(t.hour):''}</span>`:''}${t.due?`<span class="todo-pill">Échéance ${todoFmt(t.due)}</span>`:''}${late?`<span class="todo-pill">EN RETARD</span>`:''}${running?`<span class="todo-pill">EN COURS</span>`:''}</div>`;
 document.getElementById('todoActionButtons').innerHTML=running?`<button class="primary" onclick="todoComplete('${id}');todoCloseActions()">J'AI FINI</button><button onclick="todoStop('${id}');todoCloseActions()">JE NE M'EN OCCUPE PLUS</button>`:`<button class="primary" onclick="todoStart('${id}');todoCloseActions()">JE COMMENCE</button><button onclick="todoComplete('${id}');todoCloseActions()">J'AI FINI</button>`;
 document.getElementById('todoActionButtons').insertAdjacentHTML('beforeend',`<button onclick="todoCloseActions();todoEdit('${id}')">MODIFIER</button><button class="danger" onclick="todoCloseActions();todoDelete('${id}')">SUPPRIMER</button>`);
 document.getElementById('todoActionModal').classList.add('show');
}
function todoCloseActions(){document.getElementById('todoActionModal').classList.remove('show')}
function todoBanner(){
  const running=TODO_DATA.tasks.filter(t=>!t.archived&&t.status==='En cours');const late=TODO_DATA.tasks.filter(t=>!t.archived&&todoIsLate(t)).length;
  if(!running.length)return '';
  return `<div class="todo-running-banner"><div class="todo-running-summary"><span class="todo-running-dot"></span><div><b>${running.length} tâche${running.length>1?'s':''} en cours</b><span>${late} en retard</span></div></div><div class="todo-running-list">${running.map(t=>`<div class="todo-running-item"><span>${todoEsc(t.task)}</span><div><button class="mini primary" onclick="todoComplete('${t.id}')">J’AI FINI</button></div></div>`).join('')}</div></div>`
}
function todoRender(){
  const active=TODO_DATA.tasks.filter(t=>!t.archived&&t.status!=='Terminé'),running=active.filter(t=>t.status==='En cours'),late=active.filter(todoIsLate).length;const root=document.getElementById('todo');
  root.innerHTML=`<div class="todo-wrap">${todoBanner()}<div class="todo-stats"><div class="todo-stat"><b>${active.length}</b><span>tâches à faire</span></div><div class="todo-stat"><b>${running.length}</b><span>en cours</span></div><div class="todo-stat"><b>${late}</b><span>en retard</span></div></div><div class="todo-new-head"><div class="section-title" style="margin-bottom:0">Mes tâches</div><button class="todo-new-button" onclick="todoOpenComposer()" aria-label="Créer une nouvelle tâche">+</button></div><div id="todoComposer" class="todo-composer" style="display:none"><div class="todo-composer-head"><b>Nouvelle tâche</b><button class="close" onclick="todoCloseComposer()">✕</button></div><div class="todo-grid"><div class="todo-field todo-full"><label>Tâche</label><input id="newTask" placeholder="Que faut-il faire ?"></div><div class="todo-field"><label>Catégorie</label><select id="newCat"></select></div><div class="todo-field"><label>Personne</label><select id="newPerson"></select></div><div class="todo-field"><label>Priorité</label><select id="newPrio"></select></div><div class="todo-field"><label>Temps</label><select id="newTime"></select></div><div class="todo-field"><label>Date</label><input id="newDate" type="date"></div><div class="todo-field"><label>Heure</label><input id="newHour" type="time"></div><div class="todo-field"><label>Échéance</label><input id="newDue" type="date"></div><div class="todo-field"><label>Récurrence</label><select id="newRec"></select></div></div><div class="todo-actions" style="margin-top:10px;justify-content:flex-start"><button class="primary" onclick="todoCreate()">CRÉER</button></div></div><div class="section-title todo-section-head"><span>Liste des tâches</span><div><button class="todo-refresh" onclick="todoExport()">Sauvegarder</button><button class="todo-refresh" onclick="document.getElementById('todoImport').click()">Restaurer</button><input id="todoImport" type="file" accept="application/json" hidden onchange="todoImport(event)"></div></div><div id="todoList">${active.length?active.map(todoTaskCard).join(''):'<div class="todo-empty">Aucune tâche active.</div>'}</div></div>`;todoFillForm();
}
function todoOpenComposer(){
  const box=document.getElementById('todoComposer');
  if(!box)return;
  box.style.display='block';
  todoFillForm();
  setTimeout(()=>document.getElementById('newTask')?.focus(),50);
}
function todoCloseComposer(){
  const box=document.getElementById('todoComposer');
  if(box)box.style.display='none';
}
function todoFillForm(){const l=TODO_DATA.lists;const fill=(id,a,any)=>{const e=document.getElementById(id);if(e)e.innerHTML=todoOptions(a||[],any)};fill('newCat',l.categories);fill('newPerson',l.people);fill('newPrio',l.priorities);fill('newTime',l.times);fill('newRec',l.recurrences);if(document.getElementById('newPrio'))document.getElementById('newPrio').value='Normale';if(document.getElementById('newRec'))document.getElementById('newRec').value='Aucune'}
function todoRenderDo(){const root=document.getElementById('do');const l=TODO_DATA.lists;root.innerHTML=`<div class="todo-wrap">${todoBanner()}<div class="section-title">QUE PUIS-JE FAIRE ?</div><div class="todo-filters"><div class="todo-filter-chip"><span>Temps</span><select id="fTime">${todoOptions(l.times,true)}</select></div><div class="todo-filter-chip"><span>Personne</span><select id="fPerson">${todoOptions(l.people,true)}</select></div><div class="todo-filter-chip"><span>Catégorie</span><select id="fCat">${todoOptions(l.categories,true)}</select></div><div class="todo-filter-chip"><span>Quand</span><select id="fWhen">${todoOptions(l.when,true)}</select></div></div><div id="doCount" class="muted" style="margin:6px 3px 8px"></div><div id="doList"></div></div>`;['fTime','fPerson','fCat','fWhen'].forEach(id=>document.getElementById(id).onchange=todoApplyFilter);todoApplyFilter()}
function todoApplyFilter(){const f={time:document.getElementById('fTime').value,person:document.getElementById('fPerson').value,cat:document.getElementById('fCat').value,when:document.getElementById('fWhen').value};const arr=todoLocalFilter(f);document.getElementById('doCount').textContent=arr.length+' tâche'+(arr.length>1?'s':'');document.getElementById('doList').innerHTML=arr.length?arr.map(todoTaskCard).join(''):'<div class="todo-empty">Aucune tâche ne correspond à ces filtres.</div>'}
function todoPersistRender(){todoRecalc();todoRender();if(state.screen==='do')todoRenderDo()}
function todoPatch(task){const i=TODO_DATA.tasks.findIndex(x=>x.id===task.id);if(i>=0)TODO_DATA.tasks[i]=task;else TODO_DATA.tasks.push(task);todoPersistRender()}
function todoStart(id){const t=TODO_DATA.tasks.find(x=>x.id===id);if(!t)return;t.status='En cours';t.archived=false;todoPersistRender()}
function todoResume(id){todoStart(id)}
function todoStop(id){const t=TODO_DATA.tasks.find(x=>x.id===id);if(!t)return;t.status=todoIsLate(t)?'À faire':'À faire';todoPersistRender()}
function todoAddNextOccurrence(t){if(!t.rec||t.rec==='Aucune'||!t.date)return;const d=todoParseDate(t.date);let next=new Date(d);const addDays=n=>next.setDate(next.getDate()+n);const addMonths=n=>{const day=next.getDate();next.setDate(1);next.setMonth(next.getMonth()+n);const last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();next.setDate(Math.min(day,last))};if(t.rec==='Tous les jours')addDays(1);else if(t.rec==='Toutes les semaines')addDays(7);else if(t.rec==='Toutes les 2 semaines')addDays(14);else if(t.rec==='Tous les mois')addMonths(1);else if(t.rec==='Tous les 6 mois')addMonths(6);else if(t.rec==='Tous les ans')addMonths(12);else{const days={'Tous les dimanches':0,'Tous les lundis':1,'Tous les mardis':2,'Tous les mercredis':3,'Tous les jeudis':4,'Tous les vendredis':5,'Tous les samedis':6};if(days[t.rec]!==undefined){let diff=(days[t.rec]-next.getDay()+7)%7;if(diff===0)diff=7;addDays(diff)}else return}const nt={...t,id:todoNextId(),date:todoDateKey(next),status:'À faire',archived:false,done:'',next:'',seriesId:t.seriesId||t.id,created:new Date().toISOString()};TODO_DATA.tasks.push(nt);t.next=nt.date}
function todoComplete(id){const t=TODO_DATA.tasks.find(x=>x.id===id);if(!t)return;t.status='Terminé';t.archived=true;t.done=new Date().toISOString();todoAddNextOccurrence(t);todoPersistRender();showToast(t.rec&&t.rec!=='Aucune'?'Terminé · prochaine occurrence créée':'Tâche terminée')}
function todoCreate(){const task=document.getElementById('newTask')?.value.trim();if(!task)return alert('La tâche est obligatoire.');const t={id:todoNextId(),task,cat:document.getElementById('newCat').value,person:document.getElementById('newPerson').value,prio:document.getElementById('newPrio').value||'Normale',time:document.getElementById('newTime').value,date:document.getElementById('newDate').value,hour:document.getElementById('newHour').value,due:document.getElementById('newDue').value,rec:document.getElementById('newRec').value||'Aucune',status:'À faire',archived:false,created:new Date().toISOString(),done:'',next:'',seriesId:null};if(!t.cat||!t.person)return alert('Catégorie et personne sont obligatoires.');if(t.rec!=='Aucune')t.seriesId=todoNewSeriesId();TODO_DATA.tasks.push(t);todoPersistRender();todoCloseComposer();showToast('Tâche créée')}
function todoEdit(id){const t=TODO_DATA.tasks.find(x=>x.id===id);if(!t)return;TODO_EDIT_ID=id;const l=TODO_DATA.lists;document.getElementById('todoEditForm').innerHTML=`<div class="todo-grid"><div class="todo-field todo-full"><label>Tâche</label><input id="eTask" value="${todoAttr(t.task)}"></div><div class="todo-field"><label>Catégorie</label><select id="eCat">${todoOptions(l.categories)}</select></div><div class="todo-field"><label>Personne</label><select id="ePerson">${todoOptions(l.people)}</select></div><div class="todo-field"><label>Priorité</label><select id="ePrio">${todoOptions(l.priorities)}</select></div><div class="todo-field"><label>Temps</label><select id="eTime">${todoOptions(l.times)}</select></div><div class="todo-field"><label>Date</label><input id="eDate" type="date" value="${t.date||''}"></div><div class="todo-field"><label>Heure</label><input id="eHour" type="time" value="${t.hour||''}"></div><div class="todo-field"><label>Échéance</label><input id="eDue" type="date" value="${t.due||''}"></div><div class="todo-field"><label>Récurrence</label><select id="eRec">${todoOptions(l.recurrences)}</select></div></div>`;['eCat','ePerson','ePrio','eTime','eRec'].forEach((x,i)=>document.getElementById(x).value=[t.cat,t.person,t.prio,t.time,t.rec][i]);document.getElementById('todoEditModal').classList.add('show')}
function todoCloseEdit(){TODO_EDIT_ID=null;document.getElementById('todoEditModal').classList.remove('show')}
function todoSaveEdit(){const t=TODO_DATA.tasks.find(x=>x.id===TODO_EDIT_ID);if(!t)return;const data={task:document.getElementById('eTask').value.trim(),cat:document.getElementById('eCat').value,person:document.getElementById('ePerson').value,prio:document.getElementById('ePrio').value,time:document.getElementById('eTime').value,date:document.getElementById('eDate').value,hour:document.getElementById('eHour').value,due:document.getElementById('eDue').value,rec:document.getElementById('eRec').value};if(!data.task)return alert('La tâche est obligatoire.');Object.assign(t,data);if(t.rec==='Aucune')t.seriesId=null;else if(!t.seriesId)t.seriesId=todoNewSeriesId();todoCloseEdit();todoPersistRender();showToast('Tâche modifiée')}
function todoDelete(id){const t=TODO_DATA.tasks.find(x=>x.id===id);if(!t)return;if(t.rec&&t.rec!=='Aucune'){const all=confirm('Cette tâche est récurrente. OK = supprimer toute la série. Annuler = supprimer seulement cette occurrence.');if(all){if(!confirm('Confirmer la suppression de toute la série ?'))return;TODO_DATA.tasks=TODO_DATA.tasks.filter(x=>x.seriesId!==t.seriesId);showToast('Série supprimée')}else if(confirm('Supprimer seulement cette occurrence ?')){TODO_DATA.tasks=TODO_DATA.tasks.filter(x=>x.id!==id);showToast('Occurrence supprimée')}}else if(confirm('Supprimer cette tâche ?')){TODO_DATA.tasks=TODO_DATA.tasks.filter(x=>x.id!==id);showToast('Tâche supprimée')}todoPersistRender()}
function todoExport(){const blob=new Blob([JSON.stringify({version:9,exportedAt:new Date().toISOString(),tasks:TODO_DATA.tasks},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CHLOVAN_TODO_sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function todoImport(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw new Error('Fichier invalide');TODO_DATA={tasks:d.tasks.map(todoNormalizeTask),lists:TODO_LISTS};todoPersistRender();showToast('Sauvegarde restaurée')}catch(e){alert('Impossible de restaurer cette sauvegarde.')}};r.readAsText(f);ev.target.value=''}
function todoBoot(){todoLoad();todoRender()}

todoBoot();
init();
</script>
<style>
.mobile-ingredient-suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;max-height:220px;overflow:auto;display:none}
.mobile-ingredient-suggest button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 14px;font-size:16px;border-bottom:1px solid var(--line)}
.mobile-ingredient-suggest button:last-child{border-bottom:0}
.ingredient-edit{position:relative}
</style>
<script>
(function(){
  function setupIngredientSuggest(input){
    if(!input || input.dataset.suggestReady) return;
    input.dataset.suggestReady='1';
    const box=document.createElement('div'); box.className='mobile-ingredient-suggest';
    input.parentElement.appendChild(box);
    function names(){
      return (typeof getUsedIngredients==='function'?getUsedIngredients():[]);
    }
    function render(){
      const q=norm(input.value||'');
      if(!q){box.style.display='none'; box.innerHTML=''; return;}
      const list=names().filter(n=>norm(n).startsWith(q)).slice(0,12);
      if(!list.length){box.style.display='none'; box.innerHTML=''; return;}
      box.innerHTML=list.map(n=>`<button type="button">${esc(n)}</button>`).join('');
      box.querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>{
        input.value=list[i]; box.style.display='none';
        input.dispatchEvent(new Event('input',{bubbles:true}));
      }));
      box.style.display='block';
    }
    input.addEventListener('input',render);
    input.addEventListener('focus',render);
    input.addEventListener('blur',()=>setTimeout(()=>box.style.display='none',180));
  }
  function scan(){document.querySelectorAll('#ingredientRows .ing-name').forEach(setupIngredientSuggest)}
  const old=window.addIngredientRow;
  if(typeof old==='function'){
    window.addIngredientRow=function(){old.apply(this,arguments); setTimeout(scan,0)};
  }
  new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  scan();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
